import org.gradle.api.plugins.jvm.JvmTestSuite
import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar
import com.github.jengelman.gradle.plugins.shadow.transformers.PropertiesFileTransformer

plugins {
    id 'application'
    id 'jvm-test-suite'
    id 'idea'
    id 'eclipse'
    id 'maven-publish'
    alias libs.plugins.gradleutils
    alias libs.plugins.gitversion
    alias libs.plugins.changelog
    alias libs.plugins.licenser
    alias libs.plugins.shadow
}

gradleutils.displayName = 'Class Transformer'
description = 'A command line tool to apply Class Transformations'
group = 'net.minecraftforge'
version = gitversion.tagOffset

println "Version: $version"

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

application {
    mainModule = 'net.minecraftforge.classtransformer'
    mainClass = 'net.minecraftforge.classtransformer.Main'
}

testing {
    suites.named('test', JvmTestSuite) {
        useJUnitJupiter(libs.versions.junit)

        dependencies {
            implementation libs.junit.api
            runtimeOnly.bundle libs.bundles.junit.runtime
        }
    }
}

repositories {
    mavenCentral()
    maven gradleutils.forgeMaven
}

dependencies {
    compileOnly libs.jspecify
    implementation libs.jopt
    implementation libs.renamer
    implementation libs.bundles.asm // Needed for renamer
    implementation project('classtransformer-api')
}

