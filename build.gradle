import org.gradle.api.plugins.jvm.JvmTestSuite

plugins {
    id 'application'
    id 'jvm-test-suite'
    id 'idea'
    id 'eclipse'
    id 'maven-publish'
    alias libs.plugins.gradleutils
    alias libs.plugins.gitversion
    alias libs.plugins.changelog
    alias libs.plugins.licenser
}

gradleutils.displayName = 'Class Transformer'
description = 'A command line tool to apply Class Transformations'
group = 'net.minecraftforge'
version = gitversion.version

println "Version: $version"

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

application {
    mainModule = 'net.minecraftforge.classtransformer'
    mainClass = 'net.minecraftforge.classtransformer.Main'
}

testing {
    suites.named('test', JvmTestSuite) {
        useJUnitJupiter(libs.versions.junit)

        dependencies {
            implementation libs.junit.api
            runtimeOnly.bundle libs.bundles.junit.runtime
        }
    }
}

repositories {
    mavenCentral()
    maven gradleutils.forgeMaven
}

configurations {
    testTransformers
}

dependencies {
    compileOnly libs.jspecify
    implementation libs.jopt
    implementation libs.renamer
    implementation libs.bundles.asm // Needed for renamer
    implementation project('classtransformer-api')

    testTransformers project(':classtransformer-demo-transformer')
}

// This is here so that we can debug in intellij, using custom classpaths breaks modularity if done in IDE
tasks.named('run', JavaExec) {
    classpath.from(configurations.testTransformers)
    mainModule = application.mainModule
    mainClass = application.mainClass

    args '--input', configurations.detachedConfiguration(dependencies.project(path: ':classtransformer-demo'))
        .setTransitive(false).singleFile.absolutePath
    args '--output', project.layout.buildDirectory.file('test-transformed.jar').get().asFile.absolutePath
}

changelog {
    fromBase()
}

license {
    header = file('LICENSE-header.txt')
    newLine = false
    exclude '**/*.properties'
}

publishing {
    repositories {
        maven gradleutils.publishingForgeMaven
    }

    publications.register('mavenJava', MavenPublication) {
        changelog.publish(it)
        gradleutils.promote(it)

        suppressAllPomMetadataWarnings()
        from components.java

        pom {
            name = 'ClassTransformer'
            description = 'A tool that runs Class Transformers using ClassFile api over jar archives'
            url = 'https://github.com/MinecraftForge/ClassTransformer'

            gradleutils.pom.addRemoteDetails(pom)

            license gradleutils.pom.licenses.LGPLv2_1

            developers {
                developer gradleutils.pom.developers.LexManos
            }
        }
    }
}
