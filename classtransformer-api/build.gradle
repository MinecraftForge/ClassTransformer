
plugins {
    id 'java-library'
    id 'maven-publish'
    alias libs.plugins.gradleutils
    alias libs.plugins.gitversion
    alias libs.plugins.changelog
    alias libs.plugins.licenser
}

gradleutils.displayName = 'Class Transformer API'
description = 'Class Transformer API'
group = 'net.minecraftforge'
version = gitversion.version

println "Version: $version"

java {
    // We use java 25 because that's when ClassFile API was released
    toolchain.languageVersion = JavaLanguageVersion.of(25) 
    withSourcesJar()
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly libs.jspecify
}

changelog {
    fromBase()
}

license {
    header = file('../LICENSE-header.txt')
}

publishing {
    repositories {
        maven gradleutils.publishingForgeMaven
    }

    publications.register('mavenJava', MavenPublication) {
        changelog.publish(it)
        gradleutils.promote(it)

        suppressAllPomMetadataWarnings()
        from components.java

        pom {
            name = 'Class Transformer API'
            description = 'API package for our Class Transformers'
            url = 'https://github.com/MinecraftForge/ClassTransformer'

            gradleutils.pom.addRemoteDetails(pom)

            license gradleutils.pom.licenses.LGPLv2_1

            developers {
                developer gradleutils.pom.developers.LexManos
                developer gradleutils.pom.developers.Paint_Ninja
            }
        }
    }
}
